services:
  # Single service: a headful Patchright Chrome rendered on the container's own
  # Xvfb display (started by entrypoint.sh). No external browser service and no
  # host X11 socket needed. shm_size is raised because headful Chrome crashes
  # with the 64 MB default /dev/shm.
  payback:
    build: .
    environment:
      - TZ=Europe/Berlin
    env_file:
      - .env
      - .env.local
    shm_size: 2g
    restart: unless-stopped
